---
layout: default
---

{% assign archive_title = page.title | strip %}

<article class="content-page archive-page" itemscope itemtype="http://schema.org/CollectionPage">
  {% if archive_title != empty %}
    <header class="page-header archive-header">
      <h1 class="page-title" itemprop="headline">{{ page.title | markdownify | remove: '<p>' | remove: '</p>' }}</h1>
    </header>
  {% endif %}

  <div class="prose archive-content page__content" itemprop="mainContentOfPage">
    {{ content }}
  </div>
</article>
